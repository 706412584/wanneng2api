name: build

# 只做两件事：验证代码能过静态检查与回归，以及在 Linux 上产出安装包。
# Windows 包继续在本地出（依赖本机网关目录与签名策略），这里不重复。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            shell/package-lock.json
            ui/package-lock.json

      - name: 安装依赖
        run: |
          npm --prefix shell ci
          npm --prefix ui ci

      - name: 静态检查
        run: npm --prefix shell run check

      # 进程编排回归要用真实子进程（node 拉 mock 服务），这正是本平台
# spawn / 杀进程树 / 端口探测的唯一可执行验证，所以不加 --config-only。
      - name: 回归测试
        run: |
          npm --prefix shell run test:manager
          node shell/scripts/test-gateway-panel.js
          node shell/scripts/test-plugin-panel.js
          node shell/scripts/test-api-server.js
          npm --prefix shell run test:install
          npm --prefix shell run test:self-update

      - name: UI 构建
        run: npm --prefix ui run build

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            shell/package-lock.json
            ui/package-lock.json

      - name: 安装依赖
        run: |
          npm --prefix shell ci
          npm --prefix ui ci

      - name: 构建 UI
        run: npm --prefix ui run build

      - name: 打包 Linux（AppImage + deb）
        working-directory: shell
        env:
          # 不自动发布，产物交给下一步显式上传
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --x64 --publish never

      - name: 校验产物
        run: |
          ls -lh shell/dist/*.AppImage shell/dist/*.deb shell/dist/latest-linux.yml
          # AppImage 必须可执行，否则用户下载后跑不起来
          test -x shell/dist/*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            shell/dist/*.AppImage
            shell/dist/*.deb
            shell/dist/latest-linux.yml
            shell/dist/*.blockmap
          if-no-files-found: error